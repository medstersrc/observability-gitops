apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-collector-gateway
  namespace: argocd
spec:
  generators:
    - list:
        # Each element becomes a separate Argo CD Application.
        elements:
          - env: dev
            ns: observability-dev
          - env: sit
            ns: observability-sit
          - env: uat
            ns: observability-uat
          - env: prod
            ns: observability-prod
  template:
    metadata:
      # Application name is templated per environment.
      name: otel-collector-gateway-{{env}}
    spec:
      project: default
      source:
        repoURL: https://github.com/medstersrc/observability-gitops.git
        targetRevision: main
        # Chart path is relative to the repo root.
        path: helm/otel-collector
        helm:
          valueFiles:
            - values.yaml
            - values/common/gateway.yaml
            # Values files are resolved relative to the chart path.
            - values/{{env}}/gateway.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ns}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
