opentelemetry-collector:
  mode: daemonset
  fullnameOverride: otel-collector-daemon
  service:
    enabled: true
    internalTrafficPolicy: Local
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  config:
    exporters:
      otlp/gateway:
        endpoint: otel-collector-gateway.observability-dev.svc.cluster.local:4317
        tls:
          insecure: true
      logging:
        loglevel: info
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway, logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway, logging]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway, logging]
