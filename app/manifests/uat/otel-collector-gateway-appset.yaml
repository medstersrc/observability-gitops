apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-collector-gateway-uat
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: uat
            ns: observability-uat
  template:
    metadata:
      name: otel-collector-gateway-{{env}}
    spec:
      project: default
      source:
        repoURL: https://github.com/medstersrc/observability-gitops.git
        targetRevision: main
        path: helm/otel-collector
        helm:
          valueFiles:
            - values.yaml
            - values/common/gateway.yaml
            - values/{{env}}/gateway.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ns}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
